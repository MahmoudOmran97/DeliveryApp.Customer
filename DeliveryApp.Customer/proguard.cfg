# ============================================================
# R8 rules - DeliveryApp.Customer (com.taly.customer)
# ملاحظة: .NET for Android بيولّد قواعد keep تلقائية لكلاسات C# (mono.*, crc64*)
# ومكتبات Firebase/GMS جايبة معاها consumer rules، فمش محتاجين نكرّرها هنا.
# الهدف: نسيب R8 يعمل obfuscation على أكبر قدر ممكن من الكود.
# ============================================================

# لا تضع -dontobfuscate هنا أبداً (ده اللي بيحدد نسبة "إخفاء مفاتيح فك التشفير")

-keepattributes Signature,*Annotation*,InnerClasses,EnclosingMethod,Exceptions

# Agora RTC: الـ native (.so) بينادي كلاسات/ميثودز Java بالاسم عن طريق JNI،
# فلازم تفضل بأسمائها وإلا المكالمات هتعمل crash.
-keep class io.agora.** { *; }
-dontwarn io.agora.**

# تحذيرات مكتبات اختيارية
-dontwarn com.google.firebase.**
-dontwarn com.google.android.gms.**
-dontwarn javax.annotation.**
-dontwarn org.checkerframework.**
